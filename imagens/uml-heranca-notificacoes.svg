<svg xmlns="http://www.w3.org/2000/svg" width="640" height="300" viewBox="0 0 640 300" font-family="Helvetica, Arial, sans-serif" font-size="14">
  <title>Herança entre notificações</title>
  <desc>Caixa Notificacao, em cima, com o atributo texto e o método apresentar(). Em baixo, à esquerda, a caixa NotificacaoBreve, sem atributos nem métodos próprios; à direita, a caixa NotificacaoDetalhada, com o método apresentar(). De cada uma das duas caixas de baixo sai uma linha que sobe até Notificacao e termina num triângulo vazio encostado a Notificacao.</desc>
  <rect x="0" y="0" width="640" height="300" fill="#ffffff"/>
  <!-- Notificacao -->
  <rect x="220" y="20" width="200" height="92" fill="#ffffff" stroke="#000000" stroke-width="1.5"/>
  <line x1="220" y1="56" x2="420" y2="56" stroke="#000000" stroke-width="1.5"/>
  <line x1="220" y1="82" x2="420" y2="82" stroke="#000000" stroke-width="1.5"/>
  <text x="320" y="44" text-anchor="middle" font-weight="bold">Notificacao</text>
  <text x="232" y="74">texto</text>
  <text x="232" y="103">apresentar()</text>
  <!-- NotificacaoBreve -->
  <rect x="40" y="200" width="220" height="68" fill="#ffffff" stroke="#000000" stroke-width="1.5"/>
  <line x1="40" y1="236" x2="260" y2="236" stroke="#000000" stroke-width="1.5"/>
  <line x1="40" y1="252" x2="260" y2="252" stroke="#000000" stroke-width="1.5"/>
  <text x="150" y="224" text-anchor="middle" font-weight="bold">NotificacaoBreve</text>
  <!-- NotificacaoDetalhada -->
  <rect x="380" y="200" width="220" height="84" fill="#ffffff" stroke="#000000" stroke-width="1.5"/>
  <line x1="380" y1="236" x2="600" y2="236" stroke="#000000" stroke-width="1.5"/>
  <line x1="380" y1="252" x2="600" y2="252" stroke="#000000" stroke-width="1.5"/>
  <text x="490" y="224" text-anchor="middle" font-weight="bold">NotificacaoDetalhada</text>
  <text x="392" y="274">apresentar()</text>
  <!-- Setas de herança -->
  <polyline points="150,200 150,160 290,160 290,128" fill="none" stroke="#000000" stroke-width="1.5"/>
  <polygon points="290,112 281,128 299,128" fill="#ffffff" stroke="#000000" stroke-width="1.5"/>
  <polyline points="490,200 490,160 350,160 350,128" fill="none" stroke="#000000" stroke-width="1.5"/>
  <polygon points="350,112 341,128 359,128" fill="#ffffff" stroke="#000000" stroke-width="1.5"/>
</svg>
