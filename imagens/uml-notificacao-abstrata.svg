<svg xmlns="http://www.w3.org/2000/svg" width="760" height="320" viewBox="0 0 760 320" font-family="Helvetica, Arial, sans-serif" font-size="14">
  <title>Classe abstrata Notificacao e três variantes</title>
  <desc>Caixa Notificacao, em cima, com o nome em itálico e a indicação {abstract} por baixo do nome, o atributo texto e o método apresentar() em itálico. Em baixo, três caixas: NotificacaoBreve com o método apresentar(); NotificacaoDetalhada com o método apresentar(); NotificacaoAssinada com o atributo origem e o método apresentar(). As três ligam-se a Notificacao por linhas que se juntam numa só e terminam num triângulo vazio encostado a Notificacao.</desc>
  <rect x="0" y="0" width="760" height="320" fill="#ffffff"/>
  <!-- Notificacao abstrata -->
  <rect x="270" y="20" width="220" height="106" fill="#ffffff" stroke="#000000" stroke-width="1.5"/>
  <line x1="270" y1="70" x2="490" y2="70" stroke="#000000" stroke-width="1.5"/>
  <line x1="270" y1="96" x2="490" y2="96" stroke="#000000" stroke-width="1.5"/>
  <text x="380" y="42" text-anchor="middle" font-weight="bold" font-style="italic">Notificacao</text>
  <text x="380" y="62" text-anchor="middle" font-size="12">{abstract}</text>
  <text x="282" y="88">texto</text>
  <text x="282" y="117" font-style="italic">apresentar()</text>
  <!-- NotificacaoBreve -->
  <rect x="20" y="210" width="220" height="82" fill="#ffffff" stroke="#000000" stroke-width="1.5"/>
  <line x1="20" y1="246" x2="240" y2="246" stroke="#000000" stroke-width="1.5"/>
  <line x1="20" y1="262" x2="240" y2="262" stroke="#000000" stroke-width="1.5"/>
  <text x="130" y="234" text-anchor="middle" font-weight="bold">NotificacaoBreve</text>
  <text x="32" y="283">apresentar()</text>
  <!-- NotificacaoDetalhada -->
  <rect x="270" y="210" width="220" height="82" fill="#ffffff" stroke="#000000" stroke-width="1.5"/>
  <line x1="270" y1="246" x2="490" y2="246" stroke="#000000" stroke-width="1.5"/>
  <line x1="270" y1="262" x2="490" y2="262" stroke="#000000" stroke-width="1.5"/>
  <text x="380" y="234" text-anchor="middle" font-weight="bold">NotificacaoDetalhada</text>
  <text x="282" y="283">apresentar()</text>
  <!-- NotificacaoAssinada -->
  <rect x="520" y="210" width="220" height="92" fill="#ffffff" stroke="#000000" stroke-width="1.5"/>
  <line x1="520" y1="246" x2="740" y2="246" stroke="#000000" stroke-width="1.5"/>
  <line x1="520" y1="272" x2="740" y2="272" stroke="#000000" stroke-width="1.5"/>
  <text x="630" y="234" text-anchor="middle" font-weight="bold">NotificacaoAssinada</text>
  <text x="532" y="264">origem</text>
  <text x="532" y="293">apresentar()</text>
  <!-- Herança com triângulo partilhado -->
  <line x1="130" y1="210" x2="130" y2="175" stroke="#000000" stroke-width="1.5"/>
  <line x1="380" y1="210" x2="380" y2="175" stroke="#000000" stroke-width="1.5"/>
  <line x1="630" y1="210" x2="630" y2="175" stroke="#000000" stroke-width="1.5"/>
  <line x1="130" y1="175" x2="630" y2="175" stroke="#000000" stroke-width="1.5"/>
  <line x1="380" y1="175" x2="380" y2="142" stroke="#000000" stroke-width="1.5"/>
  <polygon points="380,126 371,142 389,142" fill="#ffffff" stroke="#000000" stroke-width="1.5"/>
</svg>
